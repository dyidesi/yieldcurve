[ui]
hideTopBar = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
borderColor = "#d2d2d7"
linkColor = "#0066cc"
redColor = "#d70015"
greenColor = "#248a3d"
orangeColor = "#c93400"
blueColor = "#0071e3"
grayColor = "#6e6e73"

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["26px", "20px", "16px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap"

chartCategoricalColors = ["#0071e3", "#ff9f0a", "#30d158", "#ff375f", "#bf5af2", "#ac8e68", "#ff2d55", "#64d2ff", "#ffd60a", "#8e8e93", "#5e5ce6", "#34c759", "#a2845e", "#ff6961", "#b44ac0"]
dataframeHeaderBackgroundColor = "#f5f5f7"
dataframeBorderColor = "#e5e5ea"

[browser]
gatherUsageStats = false

[server]
headless = true
